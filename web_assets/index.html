<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3.98" 墨水屏设备控制台</title>
<style>
:root { --p: #a8c7fa; --bg: #121316; --c: #1e2024; --fg: #e2e2e6; --m: #8e9099; --b: #3a3d45; }
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size: 12px; }
body { background: var(--bg); color: var(--fg); padding: 10px; max-width: 560px; margin: 0 auto; }
h1 { font-size: 14px; display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; border-bottom: 1px solid var(--b); margin-bottom: 8px; }
.card { background: var(--c); border: 1px solid var(--b); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
.title { font-weight: 700; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }
.btn { display: inline-flex; align-items: center; padding: 4px 8px; border-radius: 5px; border: 1px solid var(--b); font-size: 11px; font-weight: 600; cursor: pointer; text-decoration: none; background: #2d3036; color: #fff; }
.btn-p { background: var(--p); color: #002d6f; border: none; }
.btn-d { background: #ba1a1a; color: #fff; border: none; }
.btn.active { background: var(--p); color: #002d6f; border-color: var(--p); }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
label { display: block; font-size: 10px; color: var(--m); margin-bottom: 2px; }
input { width: 100%; padding: 5px 6px; border-radius: 4px; border: 1px solid var(--b); background: var(--bg); color: #fff; font-size: 11px; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
td { padding: 3px 2px; border-bottom: 1px solid rgba(255,255,255,0.05); }
td:first-child { color: var(--m); width: 42%; }
footer { margin-top: 12px; text-align: center; font-size: 10px; color: var(--m); padding-top: 8px; border-top: 1px solid var(--b); }
footer a { color: var(--p); text-decoration: none; }
</style>
</head>
<body>
<h1><span>📟 3.98" 墨水屏设备控制台</span><span style="color:#4caf50;font-size:11px">● 在线</span></h1>

<div class="card" style="background:linear-gradient(135deg,#002d6f,#004396);border-color:var(--p);color:#fff">
<div class="title"><span>✨ 随身工坊 PWA</span><a id="pwaBtn" href="https://398epd.zgqinc.gq/" target="_blank" class="btn btn-p">🚀 启动随身工坊</a></div>
<p style="font-size:10px;opacity:.9">智能工牌、痛卡立绘、微粒量化、画板与预设库</p>
</div>

<div class="card">
<div class="title"><span>🖥️ 墨水屏硬件规格版本 (A0 / A1)</span><span id="pnlBadge" style="font-size:10px;padding:1px 5px;border-radius:6px;background:var(--p);color:#000;font-weight:700">A0</span></div>
<div style="font-size:10px;color:var(--m);margin-bottom:6px">若画面错位或半屏条纹，一键切换：</div>
<div style="display:flex;gap:6px">
<button class="btn btn-p" id="b-a0" onclick="setPnl('A0')">A0 扫描走线 (默认)</button>
<button class="btn" id="b-a1" onclick="setPnl('A1')">A1 扫描走线</button>
<button class="btn" id="btnDbg" onclick="toggleDbg()" style="margin-left:auto">切换屏显 Debug</button>
</div>
</div>

<div class="card">
<div class="title"><span>📡 无线工作模式与 BLE 广播</span><span id="bleBadge" style="font-size:10px;padding:1px 5px;border-radius:6px;background:#757575">--</span></div>
<div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px">
<button class="btn wm-btn" id="wm-auto" onclick="setWm('auto')">智能自动</button>
<button class="btn wm-btn" id="wm-dual" onclick="setWm('dual')">双模并发</button>
<button class="btn wm-btn" id="wm-ble_only" onclick="setWm('ble_only')">仅蓝牙</button>
<button class="btn wm-btn" id="wm-wifi_only" onclick="setWm('wifi_only')">仅 Wi-Fi</button>
<button class="btn btn-p" id="btnBle" onclick="toggleBle()" style="margin-left:auto">蓝牙广播</button>
</div>
<div id="bleDevs" style="display:flex;flex-direction:column;gap:3px"></div>
</div>

<div class="card">
<div class="title"><span>⚙️ 系统硬件指标与诊断</span><button class="btn" onclick="loadStatus()">🔄 刷新</button></div>
<table><tbody id="diagTbody"></tbody></table>
<div style="display:flex;gap:6px;margin-top:8px">
<button class="btn" onclick="reboot()">软重启设备</button>
<button class="btn btn-d" onclick="factoryReset()">恢复出厂设置</button>
</div>
</div>

<div class="card">
<div class="title">📶 Wi-Fi 与 MQTT 配置</div>
<div class="grid">
<div><label>WiFi 名称</label><input type="text" id="ssid" placeholder="WiFi 名称"></div>
<div><label>WiFi 密码</label><input type="password" id="pass" placeholder="WiFi 密码"></div>
</div>
<div class="grid" style="grid-template-columns:2fr 1fr">
<div><label>MQTT 主机</label><input type="text" id="mqttHost" placeholder="IP / 主机名"></div>
<div><label>MQTT 端口</label><input type="number" id="mqttPort" placeholder="1883" value="1883"></div>
</div>
<button class="btn btn-p" style="width:100%" onclick="saveCfg()">💾 保存 Wi-Fi 与 MQTT 配置</button>
</div>

<footer>
<div><a href="https://github.com/ZGQ-inc/3.98-epd" target="_blank">GitHub</a> · <a href="https://domain.zgqinc.gq/" target="_blank">作者主页</a> · MIT License</div>
</footer>

<script>
let curIp='',gBle=true,gPnl='A0';
const $=id=>document.getElementById(id);
const api=async(p,b)=>(await fetch('/api/'+p,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:b===null?{method:'POST'}:{})).json();

async function loadStatus(){
try{
const d=await api('system/status');
if(d.ip_address&&d.ip_address!=='0.0.0.0'){curIp=d.ip_address;$('pwaBtn').href='https://398epd.zgqinc.gq/?ip='+curIp}
gPnl=d.panel_version||'A0';
$('pnlBadge').textContent=gPnl==='A1'?'A1 走线':'A0 走线';
$('pnlBadge').style.background=gPnl==='A1'?'#ff9800':'var(--p)';
$('b-a0').className='btn '+(gPnl==='A0'?'btn-p':'');
$('b-a1').className='btn '+(gPnl==='A1'?'btn-p':'');
$('btnDbg').textContent=d.screen_debug?'Debug: 已开启':'Debug: 已关闭';
gBle=d.ble_enabled;
const st=d.ble_status||'OFF';
$('bleBadge').textContent=st==='CONN'?'已连接':(st==='ADV'?'广播中':'已关闭');
$('bleBadge').style.background=st==='CONN'?'#1565c0':(st==='ADV'?'#2e7d32':'#757575');
$('btnBle').textContent=gBle?'关闭蓝牙':'开启蓝牙';
document.querySelectorAll('.wm-btn').forEach(b=>b.classList.remove('active'));
const wb=$('wm-'+d.wireless_mode);if(wb)wb.classList.add('active');

const devs=d.ble_devices||[];
$('bleDevs').innerHTML=devs.length?devs.map(x=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:3px 6px;background:var(--bg);border-radius:4px"><span>📱 ${x.name||'WebBLE'} (${x.rssi||0}dBm)</span><button class="btn btn-d" style="padding:1px 5px" onclick="disBle('${x.id}')">断开</button></div>`).join(''):'<div style="padding:2px;font-size:10px;color:var(--m);text-align:center">暂无已连接蓝牙设备</div>';

const u=d.uptime_secs||0;
const upStr=`${Math.floor(u/86400)}天 ${Math.floor((u%86400)/3600)}时 ${Math.floor((u%3600)/60)}分 ${u%60}秒`;
const nvsTot=d.nvs_size||24192;
const nvsUsed=d.nvs_used_bytes||6752;
const nvsFree=nvsTot-nvsUsed;

const rows=[
['主控芯片',d.chip_model||'ESP32-C3'],
['MAC 地址',d.mac_address||'--'],
['Wi-Fi 信号 (RSSI)',`${d.wifi_mode||'STA'} (${d.wifi_rssi||0} dBm)`],
['局域网 IP / 状态',`${d.ip_address||'--'} (在线)`],
['北京时间 (NTP)',d.current_time||(d.ntp_synced?'已同步':'校时中')],
['连续运行时间',upStr],
['可用堆内存 (SRAM)',`${(d.free_heap||0).toLocaleString()} B (最低 ${(d.min_free_heap||0).toLocaleString()} B)`],
['配置分区 (NVS 硬件实测)',`剩余 ${(nvsFree/1024).toFixed(1)} KB (总 ${(nvsTot/1024).toFixed(1)} KB, 已用 ${(nvsUsed/1024).toFixed(1)} KB)`],
['内部存储 (storage)',`剩余约 ${Math.round((d.storage_free_bytes||0)/1024)} KB`],
['墨水屏规格与走线',`${d.panel_model||'768x552 BWRY'} · ${gPnl} 走线`],
['无线工作模式',d.wireless_mode||'自动 (Auto)'],
['供电状态',d.battery_low?'⚠️ 低电量':'供电正常 (5V/3.3V)'],
['复位原因',d.reset_reason||'Normal']
];
$('diagTbody').innerHTML=rows.map(([k,v])=>`<tr><td>${k}</td><td>${v}</td></tr>`).join('');
}catch(e){}
}

async function setPnl(v){try{await api('system/panel',{version:v});alert('已切换为 '+v);loadStatus()}catch(e){alert('失败: '+e.message)}}
async function toggleDbg(){try{await api('system/debug',null);loadStatus()}catch(e){alert('失败: '+e.message)}}
async function setWm(m){try{await api('wireless/mode',{mode:m});alert('已切换为 '+m);loadStatus()}catch(e){alert('失败: '+e.message)}}
async function toggleBle(){try{await api('ble/toggle',{enabled:!gBle});loadStatus()}catch(e){alert('失败: '+e.message)}}
async function disBle(id){if(confirm('确认断开？')){await api('ble/disconnect',{id});loadStatus()}}
async function reboot(){if(confirm('确认重启设备？'))await api('system/reboot',null)}
async function factoryReset(){if(confirm('警告：确认清除所有配置并恢复出厂设置？'))await api('system/reset',null)}

async function saveCfg(){
try{
await api('config',{wifi_ssid:$('ssid').value.trim(),wifi_pass:$('pass').value.trim(),mqtt_broker:$('mqttHost').value.trim(),mqtt_port:parseInt($('mqttPort').value)||1883,panel_version:gPnl});
alert('🎉 配置已成功保存！');
}catch(e){alert('保存失败: '+e.message)}
}

window.onload=()=>{
loadStatus();
api('config').then(c=>{
if(c.wifi_ssid)$('ssid').value=c.wifi_ssid;
if(c.wifi_pass)$('pass').value=c.wifi_pass;
if(c.mqtt_broker)$('mqttHost').value=c.mqtt_broker;
if(c.mqtt_port)$('mqttPort').value=c.mqtt_port;
}).catch(()=>{});
};
</script>
</body>
</html>
